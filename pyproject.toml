[build-system]
requires = [
    "setuptools>=61.0.0",
]
build-backend = "setuptools.build_meta"

[project]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
name = "pdi-nomad-plugin"
dynamic = ["version"]
description = "A plugin for PDI NOMAD containing principal techniques."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Andrea Albino", email = "andrea.albino@physik.hu-berlin.de" },
    { name = "Hampus NÃ¤sstrÃ¶m", email = "hampus.naesstroem@physik.hu-berlin.de" },
    { name = "Sarthak Kapoor", email = "sarthak.kapoor@physik.hu-berlin.de" },
    { name = "Sebastian BrÃ¼ckner", email = "sebastian.brueckner@ikz-berlin.de" },
]
maintainers = [
    { name = "Andrea Albino", email = "andrea.albino@physik.hu-berlin.de" },
]
license = { file = "LICENSE" }
dependencies = [
    'nomad-lab>=1.3.1',
    'nomad-material-processing>=1.0.6',
    'nomad-measurements',
    'epic_scraper',
]

[tool.uv.sources]
epic_scraper = { git = "https://github.com/PDI-Berlin/EPIC_scraper.git", rev = "v1.0.0" }

[project.urls]
"Homepage" = "https://github.com/PDI-Berlin/pdi-nomad-plugin"
"Bug Tracker" = "https://github.com/PDI-Berlin/pdi-nomad-plugin/issues"

[project.optional-dependencies]
dev = ["ruff", "pytest", "structlog"]



ci = [
    "fastapi",
    "httpx",
    "quickjs",
    "tomli; python_version < '3.11'",
]
[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # isort
    "I",
    # pylint
    "PL",
]

ignore = [
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments in function definition
    "PLR0915", # Too many statements
    "PLC0415", # `import` should be at the top-level of a file
]

fixable = ["ALL"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# this is entirely optional, you can remove this if you wish to
[tool.ruff.format]
# use single quotes for strings.
quote-style = "single"

# indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points.'nomad.plugin']

general_schema = "pdi_nomad_plugin.general:schema_entry_point"
characterization_schema = "pdi_nomad_plugin.characterization:schema_entry_point"
materials_schema = "pdi_nomad_plugin.mbe:materials_schema"
instrument_schema = "pdi_nomad_plugin.mbe:instrument_schema"
processes_schema = "pdi_nomad_plugin.mbe:processes_schema"
epic_mbe_parser = "pdi_nomad_plugin.mbe.epic_parser:epic_parser"
mbe_app = "pdi_nomad_plugin.mbe.mbe_app:substrateapp"
substrate_intake = "pdi_nomad_plugin.mbe.substrate_intake:substrate_intake"
new_mbe_experiment = "pdi_nomad_plugin.mbe.new_mbe_experiment:new_mbe_experiment"
processing = "pdi_nomad_plugin.mbe.processing:processing"
lab_library = "pdi_nomad_plugin.mbe.lab_library:lab_library"
pdi_lab = "pdi_nomad_plugin.mbe.pdi_lab:pdi_lab"


[tool.setuptools.package-data]
"pdi_nomad_plugin.mbe.substrate_intake" = [
    "static/*",
]
"pdi_nomad_plugin.mbe.new_mbe_experiment" = [
    "templates/*.html",
    "static/*",
]
"pdi_nomad_plugin.mbe.processing" = [
    "templates/*.html",
    "static/*",
]
"pdi_nomad_plugin.mbe.lab_library" = [
    "templates/*.html",
    "static/*",
]

"pdi_nomad_plugin.mbe.pdi_lab" = [
    "templates/*.html",
    "static/*",
]

[tool.setuptools_scm]

[tool.ruff.lint.extend-per-file-ignores]
".pdi_app_scope_test_backup_20261016/tests/schema_compliance/test_app_schema_policy.py" = ["E501"]
