<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PDI Lab</title>
    <link rel="stylesheet" href="static/styles.css">
</head>
<body>
<div class="workspace-shell">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark">PDI</div>
            <div>
                <div class="brand-title">PDI Lab</div>
                <div class="brand-subtitle">MBE Workspace</div>
            </div>
        </div>

        <nav class="workflow-nav" aria-label="PDI Lab workflow">
            <button class="nav-item" data-app="inventory" type="button">
                <span class="nav-index">01</span>
                <span>Inventory Overview</span>
            </button>
            <button class="nav-item" data-app="intake" type="button">
                <span class="nav-index">02</span>
                <span>Substrate Check-in</span>
            </button>

            <button class="nav-item" data-app="processing" type="button">
                <span class="nav-index">03</span>
                <span>Substrate Processing</span>
            </button>

            <button class="nav-item" data-app="experiment" type="button">
                <span class="nav-index">04</span>
                <span>New MBE Experiment</span>
            </button>

            <button class="nav-item" data-app="sample_database" type="button">
                <span class="nav-index">05</span>
                <span>Sample Database</span>
            </button>
            <button class="nav-item" data-app="library" type="button">
                <span class="nav-index">06</span>
                <span>Lab Library</span>
            </button>
        </nav>

        <div class="sidebar-footer">
            <img class="sidebar-logo" src="static/pdi-lab-logo-420.png" alt="PDI Lab logo">
        </div>
    </aside>

    <main class="content-column">
        <header class="content-header">
            <div class="workspace-header-actions">
                <button
                    id="workspaceModeButton"
                    class="workspace-mode-button"
                    type="button"
                >
                    Full page
                </button>
                <div id="workspaceStep" class="step-badge">01 / 06</div>
            </div>
        </header>

        <section id="workspaceFrame" class="workspace-frame">
            <div id="loadingState" class="loading-state">
                Loading workspace...
            </div>

            <iframe class="app-frame" data-app="inventory"
                title="Inventory Overview" src="about:blank"></iframe>
            <iframe
                class="app-frame"
                data-app="intake"
                title="Substrate Check-in"
                src="about:blank"
            ></iframe>

            <iframe
                class="app-frame"
                data-app="processing"
                title="Substrate Processing"
                src="about:blank"
            ></iframe>

            <iframe
                class="app-frame"
                data-app="experiment"
                title="New MBE Experiment"
                src="about:blank"
            ></iframe>

            <iframe class="app-frame" data-app="sample_database"
                title="Sample Database" src="about:blank"></iframe>
            <iframe
                class="app-frame"
                data-app="library"
                title="Lab Library"
                src="about:blank"
            ></iframe>
        </section>
    </main>
</div>

<script src="static/app.js"></script>
</body>
</html>
