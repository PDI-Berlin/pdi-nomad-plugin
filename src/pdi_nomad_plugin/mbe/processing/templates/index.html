<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Substrate Processing</title>
    <link rel="stylesheet" href="static/styles.css">
</head>
<body>
<main class="page">
    <div class="title-row">
        <div>
            <h1>Substrate Processing</h1>
            <p class="subtitle">Apply one or more recipe-based processes to selected substrates and save them to NOMAD.</p>
        </div>
        <button id="returnButton" class="secondary" type="button" style="display:none;">Back</button>
    </div>

    <div class="layout">
        <section class="panel">
            <h2>Select substrates</h2>
            <label for="substrateSearch">Substrate ID / search</label>
            <input id="substrateSearch" type="text" placeholder="e.g. MN2490_4">
            <div class="filters">
                <div><label for="materialFilter">Material</label><select id="materialFilter"><option value="">All</option></select></div>
                <div><label for="batchFilter">Crystal ID / batch</label><select id="batchFilter"><option value="">All</option></select></div>
                <div><label for="orientationFilter">Orientation</label><select id="orientationFilter"><option value="">All</option></select></div>
                <div><label for="statusFilter">Status</label>
                    <select id="statusFilter">
                        <option value="">All</option>
                        <option value="as_delivered">As delivered</option>
                        <option value="processed">Processed</option>
                        <option value="grown">Grown</option>
                    </select>
                </div>
            </div>
            <div class="actions">
                <button id="selectAllButton" type="button">Select all filtered</button>
                <button id="clearSelectionButton" type="button">Clear selection</button>
            </div>
            <div id="substrateStatus" class="status"></div>
            <div class="result-grid result-header"><div></div><div>ID</div><div>Material</div><div>Batch</div><div>Orientation</div><div>Status</div></div>
            <div id="substrateResults"></div>
        </section>

        <section class="panel">
            <h2>Processes</h2>
            <div id="processList" class="process-list"></div>
            <button id="addProcessButton" class="add-process" type="button">+ Add another process</button>

            <div class="save-panel">
                <label for="targetUpload">Target upload</label>
                <select id="targetUpload"><option value="">Loading uploads...</option></select>
                <div id="uploadStatus" class="status">Loading writable NOMAD uploads...</div>
                <div class="save-row">
                    <div id="processStatus" class="status">Loading recipes...</div>
                    <button id="saveProcessesButton" class="primary" type="button" disabled>Save all processes</button>
                </div>
            </div>
        </section>
    </div>
</main>
<script src="static/app.js"></script>
</body>
</html>
